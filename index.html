<title>Sistema de Inventario</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: barra lateral con módulos a la izquierda, área de trabajo a la derecha; en teléfono la barra pasa arriba como pestañas con scroll. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface2:#E9EEEC; --fg:#16201E; --muted:#586965; --line:#D3DCD9;
  --accent:#0B6B5F; --accent-fg:#FFFFFF; --accent-soft:#D8EEEA;
  --good:#1B7F3B; --good-soft:#DDF1E3; --warn:#8F5A00; --warn-soft:#F8EBCB; --bad:#B3261E; --bad-soft:#F9DEDB;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
:root{--muted:#586965}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101514; --surface:#171E1C; --surface2:#212B28; --fg:#E6EEEC; --muted:#93A6A1; --line:#2C3835;
  --accent:#4FC3B2; --accent-fg:#06201C; --accent-soft:#17342F;
  --good:#5CCB7E; --good-soft:#163020; --warn:#E5B04A; --warn-soft:#3A2D0E; --bad:#FF8A80; --bad-soft:#3D1B18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101514; --surface:#171E1C; --surface2:#212B28; --fg:#E6EEEC; --muted:#93A6A1; --line:#2C3835;
  --accent:#4FC3B2; --accent-fg:#06201C; --accent-soft:#17342F;
  --good:#5CCB7E; --good-soft:#163020; --warn:#E5B04A; --warn-soft:#3A2D0E; --bad:#FF8A80; --bad-soft:#3D1B18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h1{font-size:1.5rem;letter-spacing:-.01em}
h2{font-size:1.15rem;margin-bottom:12px}
h3{font-size:.95rem}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto}
nav{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:16px}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;padding:4px 10px 12px;overflow-wrap:anywhere}
.brand small{display:block;font:500 .72rem var(--font-body);color:var(--muted);letter-spacing:.02em;margin-top:2px}
nav a,nav button.navb{display:block;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500;background:none;border:0;text-align:left;font:inherit;font-weight:500;cursor:pointer}
nav a:hover,nav button.navb:hover{background:var(--surface2)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav .sep{height:1px;background:var(--line);margin:8px 10px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.vh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.va{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card.flat{padding:0;overflow:hidden}
.banner{padding:10px 12px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.banner.info{background:var(--surface2);color:var(--muted)}
.btn{font:inherit;font-weight:500;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:4px 8px;font-size:.85rem}
.ib{border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:2px 8px;border-radius:4px}
.ib:hover{background:var(--surface2);color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem}
input.n{text-align:right;font-variant-numeric:tabular-nums;max-width:110px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:.02em}
.grid2,.grid3{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}
.row{display:flex;gap:8px;align-items:center}
.row>select{flex:1}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.sl{font-size:.75rem;font-weight:500;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.sv{font-family:var(--font-head);font-size:1.35rem;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child>td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:var(--surface2)}
tr.grp td{background:var(--surface2);font-weight:600;font-family:var(--font-head);padding:7px 12px}
.sub{font-size:.78rem;color:var(--muted)}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.tot{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tot>div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tot .big{font-family:var(--font-head);font-size:1.4rem;font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.pago{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.pago .ref{grid-column:1 / span 2}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.toolbar .fld{flex:1 1 150px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:20px;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
dialog.wide{width:min(860px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dact{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.sp{flex:1}
.pre{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:min(520px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
#toast.err{background:var(--bad);color:#fff}
.steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:4px}
.tile{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.tile:hover{background:var(--surface2)}
.tile[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tile[aria-pressed="true"] .sub{color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.pcard{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);min-width:0}
.pcard.on{border-color:var(--accent);background:var(--accent-soft)}
.pcard .pn{font-weight:600;overflow-wrap:anywhere}
.pcard .pp{font-family:var(--font-head);font-weight:600;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.3rem;line-height:1;cursor:pointer;padding:0}
.qty button:hover:not(:disabled){background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.qty button:disabled{opacity:.4;cursor:not-allowed}
.qty span{min-width:2ch;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.panel{grid-column:1 / -1;border:1px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--surface)}
.panelh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel .pgrid{margin-top:10px}
.tile[aria-expanded="true"]{grid-column:auto}
.cart th,.cart td{padding:5px 8px;font-size:.84rem}
.cart .sub{font-size:.72rem}
.cart input.n{max-width:70px;padding:3px 6px;font-size:.84rem}
.cart .qc{display:inline-flex;align-items:center;gap:4px}
.cart .qc input.n{width:46px;max-width:46px;text-align:center}
.cart .qc button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;line-height:1;padding:0;font-size:1rem}
.cart .qc button:hover:not(:disabled){background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.cart .qc button:disabled{opacity:.4;cursor:not-allowed}
.cmp h2{font-size:1rem;margin-bottom:4px}
.cmp h3{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cmp .tot{gap:3px;margin:8px 0;font-size:.84rem}
.cmp .tot .big{font-size:1.15rem;padding-top:4px}
.cmp input,.cmp select{padding:4px 7px;font-size:.84rem}
.cmp input.n{max-width:96px}
.cmp .pago{gap:6px;margin-bottom:6px;margin-top:0}
.cmp .pago input.n{max-width:none}
.cmp .quick{gap:4px;margin:6px 0}
.cmp .btn.sm{padding:3px 7px;font-size:.78rem}
.cmp .ib{font-size:1.05rem;padding:0 6px}
.cmp #f-emit{padding:7px 12px}
.susl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.susi{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.susn{min-width:0;overflow-wrap:anywhere}
.login{max-width:360px;margin:8vh auto 0}
.who{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.who .navb{padding:6px 0;color:var(--muted);font-weight:500}
.tasab{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tasab b{font-variant-numeric:tabular-nums}
fieldset.pg{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;min-width:0}
fieldset.pg legend{font-weight:600;font-size:.78rem;padding:0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pform{display:contents}
.app.nav-off{grid-template-columns:minmax(0,1fr);max-width:none}
.app.nav-off nav{display:none}
tr.subr td{font-weight:600;background:var(--surface2)}
tr.totr td{font-weight:700;border-top:2px solid var(--fg)}
@media (max-width:859px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  nav a,nav button.navb{white-space:nowrap}
  .brand{display:none}
  nav .sep{display:none}
  .who{flex-direction:row;align-items:center;gap:8px;white-space:nowrap}
  .login{margin-top:2vh}
  .split{grid-template-columns:minmax(0,1fr)}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div class="app">
  <nav id="nav" aria-label="Módulos"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><div id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="dl-prod"></datalist>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var today=function(){return new Date().toLocaleDateString('en-CA')};
var monthStart=function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('en-CA')};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
var r2=function(n){return Math.round((n+Number.EPSILON)*100)/100};
var MEDIOS=[['efectivo','Efectivo'],['transferencia','Transferencia'],['pagomovil','Pago móvil'],['tarjeta','Tarjeta']];
var medioName=function(k){for(var i=0;i<MEDIOS.length;i++)if(MEDIOS[i][0]===k)return MEDIOS[i][1];return k==='credito'?'Crédito (por pagar)':k};

/* ---------- Estado y almacenamiento ---------- */
var S={config:{negocio:'Mi negocio',rif:'',moneda:'$',iva:16},categorias:[],productos:[],proveedores:[],clientes:[],compras:[],ventas:[],movimientos:[],cierres:[],suspendidas:[],usuarios:[],roles:[],tasas:[]};
var COLS=['categorias','productos','proveedores','clientes','compras','ventas','movimientos','cierres','suspendidas','usuarios','roles','tasas'];
var DB=null, mode='cargando', ready=false, loaded={}, LS='sistema-inventario-v1';
function lsLoad(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j)for(var k in j)S[k]=j[k]}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function put(col,id,data){
  data=Object.assign({},data,{id:id});
  if(DB)return DB.collection(col).doc(id).set(data);
  var a=S[col],i=a.findIndex(function(x){return x.id===id});
  if(i<0)a.push(data);else a[i]=data;
  lsSave();schedule();return Promise.resolve();
}
function patch(col,id,data){
  if(DB)return DB.collection(col).doc(id).update(data);
  var o=S[col].find(function(x){return x.id===id});if(o)Object.assign(o,data);
  lsSave();schedule();return Promise.resolve();
}
function remove(col,id){
  if(DB)return DB.collection(col).doc(id).delete();
  S[col]=S[col].filter(function(x){return x.id!==id});lsSave();schedule();return Promise.resolve();
}
function saveConfig(){
  if(DB)return DB.collection('config').doc('general').set(S.config);
  lsSave();schedule();return Promise.resolve();
}

/* ---------- Formato ---------- */
var fm=function(n){return S.config.moneda+' '+Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})};
var fq=function(n){return Number(n||0).toLocaleString('es-VE',{maximumFractionDigits:3})};
var fd=function(iso){if(!iso)return '';var p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso};
var fdt=function(ts){try{return new Date(ts).toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'})}catch(e){return ts||''}};
var pad=function(n){return String(n).padStart(6,'0')};
var vNum=function(v){return (v.tipo==='pedido'?'P-':'F-')+pad(v.n)};
var cNum=function(c){return 'C-'+pad(c.n)};

/* ---------- Acceso: usuarios, roles y permisos ---------- */
var PERMS=[
  ['Ventas',[['facturar','Facturar (emitir facturas)'],['pedidos','Crear y gestionar pedidos'],['ventas_ver','Ver el historial de ventas'],['ventas_modificar','Modificar facturas emitidas'],['ventas_anular','Anular facturas']]],
  ['Inventario',[['inventario_ver','Ver el inventario'],['inventario_editar','Crear y editar productos y categorías'],['inventario_masivo','Entradas y salidas internas'],['movimientos','Ver movimientos de inventario'],['ver_costos','Ver costos del inventario']]],
  ['Compras y contactos',[['compras','Registrar y anular compras'],['proveedores','Gestionar proveedores'],['clientes','Gestionar clientes']]],
  ['Caja y reportes',[['caja','Cuadre de caja y cierres'],['reportes','Ver y descargar reportes'],['resumen','Ver el resumen del negocio']]],
  ['Administración',[['tasa','Actualizar la tasa BCV del día'],['ajustes','Cambiar datos del negocio e IVA']]]
];
var ALLP=[],PLABEL={};PERMS.forEach(function(g){g[1].forEach(function(x){ALLP.push(x[0]);PLABEL[x[0]]=x[1]})});
var ROLES_DEF=[
  {id:'admin',nombre:'Administrador',permisos:ALLP,sistema:true},
  {id:'cajero',nombre:'Cajero',permisos:['facturar','pedidos','ventas_ver','clientes','caja']},
  {id:'vendedor',nombre:'Vendedor',permisos:['facturar','pedidos','clientes','inventario_ver']},
  {id:'almacen',nombre:'Almacenista',permisos:['inventario_ver','inventario_editar','inventario_masivo','movimientos','compras','proveedores','ver_costos','reportes']}
];
var ME=null,IS_ED=false,EDKNOWN=false,SKEY='si-sesion',memSess='',PEND=null,LG={fails:0,until:0},seedingRoles=false;
function ssGet(){var v='';try{v=sessionStorage.getItem(SKEY)||''}catch(e){}return v||memSess}
function ssSet(v){memSess=v||'';try{if(v)sessionStorage.setItem(SKEY,v);else sessionStorage.removeItem(SKEY)}catch(e){}}
var rolDe=function(id){return S.roles.find(function(r){return r.id===id})};
var rolNombre=function(id){var r=rolDe(id);return r?r.nombre:(id==='admin'?'Administrador':'—')};
var usersOn=function(){return S.usuarios.length>0};
var canManageUsers=function(){return mode==='local'||IS_ED};
function can(k){
  if(!usersOn())return true;
  if(!ME)return false;
  if(ME.owner||ME.rolId==='admin')return true;
  if(k==='usuarios')return false;
  var r=rolDe(ME.rolId);return !!(r&&r.permisos&&r.permisos[k]);
}
function resolveSession(){
  if(!usersOn()){ME=null;return}
  var sid=ssGet();
  if(!sid){ME=null;return}
  if(sid==='owner'){
    if(IS_ED||mode==='local')ME={id:'owner',nombre:'Propietario',rolId:'admin',owner:true};
    else{ME=null;if(EDKNOWN)ssSet('')}
    return;
  }
  var u=S.usuarios.find(function(x){return x.id===sid&&x.activo!==false});
  if(u){ME={id:u.id,nombre:u.nombre,rolId:u.rolId}}
  else if(PEND&&PEND.id===sid&&Date.now()<PEND.until){ME={id:PEND.id,nombre:PEND.nombre,rolId:PEND.rolId}}
  else{ME=null;if(ready)ssSet('')}
}
function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}

async function hashPin(pin,salt){
  try{
    var enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return 'p1:'+hex(bits);
  }catch(e){
    var h=2166136261,str=salt+':'+pin;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
    return 'f1:'+(h>>>0).toString(16);
  }
}

async function moveStock(items,tipo,sign,nota,ref,costos){
  var agg=new Map();
  items.forEach(function(i){agg.set(i.productoId,(agg.get(i.productoId)||0)+num(i.cant))});
  for(var e of agg){
    var p=prod(e[0]);if(!p)continue;
    var saldo=r2(num(p.stock)+sign*e[1]),up={stock:saldo};
    if(costos&&num(costos.get(e[0]))>0)up.costo=num(costos.get(e[0]));
    await patch('productos',e[0],up);
    await logMove(p,tipo,sign*e[1],saldo,nota,ref);
  }
}

function parseBulk(text,mode){
  var rows=[],ent=mode==='entrada';
  text.split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    var sep=line.indexOf('\t')>=0?'\t':line.indexOf(';')>=0?';':',';
    var f=line.split(sep).map(function(x){return x.trim()});
    var key=f[0].toLowerCase();
    var p=S.productos.find(function(x){return String(x.codigo).toLowerCase()===key})||S.productos.find(function(x){return String(x.nombre).toLowerCase()===key});
    var cant=num(f[1]),costo=ent?num(f[2]):0,err='';
    if(/^(c[oó]digo|codigo)$/i.test(f[0])&&isNaN(parseFloat(f[1])))return;
    if(!p)err='Producto no encontrado';
    else if(!(cant>0))err='Cantidad inválida';
    else if(!ent&&cant>num(p.stock))err='Stock insuficiente ('+fq(p.stock)+')';
    rows.push({p:p,cod:f[0],cant:cant,costo:costo,err:err});
  });
  return rows;
}
function bulkPreview(){
  var ta=$('#b-text');if(!ta)return;

function inCat(p,id){var ok=!!p.categoriaId&&S.categorias.some(function(c){return c.id===p.categoriaId});return id==='_none'?!ok:p.categoriaId===id}
function catalogHTML(){
  if(!S.productos.length)return '<div class="empty">No hay productos todavía. Créalos en Inventario para venderlos desde aquí.</div>';
  var cats=S.categorias.slice().sort(byName).map(function(c){return {id:c.id,nombre:c.nombre}});
  if(S.productos.some(function(p){return inCat(p,'_none')}))cats.push({id:'_none',nombre:'Sin categoría'});
  var items=cats.map(function(c){
    var open=!!V.facOpen[c.id];
    var list=S.productos.filter(function(p){return inCat(p,c.id)}).sort(byName);
    var inCart=F.items.filter(function(i){var p=prod(i.productoId);return p&&inCat(p,c.id)}).reduce(function(a,i){return a+num(i.cant)},0);

    if(!open)return tile;
    var cards=list.map(function(p){
      var it=F.items.find(function(i){return i.productoId===p.id}),q=it?num(it.cant):0;
      var maxed=F.tipo==='factura'&&q>=avail(p);
      return '<div class="pcard'+(q>0?' on':'')+'"><div class="pn">'+esc(p.nombre)+'</div><div class="sub">'+esc(p.codigo)+' · stock '+fq(p.stock)+'</div><div class="pp">'+fm(p.precio)+(tasaVal()>0?' <span class="sub">'+fb(p.precio)+'</span>':'')+'</div><div class="qty"><button type="button" data-act="qty-dec" data-id="'+esc(p.id)+'" aria-label="Quitar una unidad de '+esc(p.nombre)+'"'+(q>0?'':' disabled')+'>−</button><span id="pq-'+esc(p.id)+'">'+fq(q)+'</span><button type="button" data-act="qty-inc" data-id="'+esc(p.id)+'" aria-label="Agregar una unidad de '+esc(p.nombre)+'"'+(maxed?' disabled':'')+'>+</button></div></div>';

function avail(p){

async function ajustarEdicion(oldE,items,numero,id){
  var ant=new Map(),nue=new Map();
  oldE.items.forEach(function(i){ant.set(i.productoId,(ant.get(i.productoId)||0)+num(i.cant))});
  items.forEach(function(i){nue.set(i.productoId,(nue.get(i.productoId)||0)+num(i.cant))});
  var ids=new Set(Array.from(ant.keys()).concat(Array.from(nue.keys())));
  for(var pid of ids){
    var diff=r2((ant.get(pid)||0)-(nue.get(pid)||0));if(diff===0)continue;
    var p=prod(pid);if(!p)continue;
    var saldo=r2(num(p.stock)+diff);
    await patch('productos',pid,{stock:saldo});
    await logMove(p,'ajuste',diff,saldo,'Modificación de factura '+numero,id);
  }
}

async function emitir(){

  if(F.editId&&(!oldE||oldE.estado==='anulada')){toast('Ese documento ya no se puede modificar.',true);return}
  var wasEdit=!!F.editId;
  for(var i=0;i<F.items.length;i++){var it=F.items[i];if(!(num(it.cant)>0)){toast('Revisa la cantidad de "'+it.nombre+'".',true);return}}
  if(esFac){
    var agg=new Map();F.items.forEach(function(i){agg.set(i.productoId,(agg.get(i.productoId)||0)+num(i.cant))});
    for(var e of agg){var p=prod(e[0]);if(!p){toast('Un producto de la lista ya no existe en el inventario.',true);return}if(e[1]>avail(p)){toast('Stock insuficiente de "'+p.nombre+'": hay '+fq(avail(p))+'.',true);return}}
    if(T.resta>0){toast('Falta cobrar '+fm(T.resta)+'.',true);return}
    var cash=F.pagos.filter(function(p){return p.medio==='efectivo'}).reduce(function(a,p){return a+num(p.monto)},0);
    if(T.vuelto>cash+0.001){toast('El exceso pagado debe estar en efectivo para poder dar vuelto.',true);return}
  }
  busy=true;
  try{
    var cli=S.clientes.find(function(c){return c.id===F.clienteId});
    var old=(F.editId||F.convertId)?S.ventas.find(function(v){return v.id===(F.editId||F.convertId)}):null;
    var items=F.items.map(function(i){var p=prod(i.productoId);return {productoId:i.productoId,codigo:i.codigo,nombre:i.nombre,cant:num(i.cant),precio:num(i.precio),costo:(function(){var oi=oldE?oldE.items.find(function(x){return x.productoId===i.productoId}):null;return oi&&oi.costo!=null?oi.costo:(p?num(p.costo):0)})()}});
    var pagos=[],vuelto=T.vuelto;
    if(esFac){
      F.pagos.forEach(function(p){var m=r2(num(p.monto));if(m>0)pagos.push({medio:p.medio,monto:m,ref:p.ref||''})});
      for(var k=0;k<pagos.length&&vuelto>0;k++){if(pagos[k].medio==='efectivo'){var d=Math.min(vuelto,pagos[k].monto);pagos[k].monto=r2(pagos[k].monto-d);vuelto=r2(vuelto-d)}}
      pagos=pagos.filter(function(p){return p.monto>0});
    }
    var id=F.editId||F.convertId||uid();
    var n=(F.editId&&old)?old.n:esFac?nextN(S.ventas,function(v){return v.tipo==='factura'?v.n:0}):(old&&old.tipo==='pedido'?old.n:nextN(S.ventas,function(v){return v.tipo==='pedido'?v.n:(v.pedidoN||0)}));
    var venta={tipo:F.tipo,n:n,fecha:F.fecha,ts:(F.editId&&old)?old.ts:new Date().toISOString(),editadaTs:(F.editId&&old)?new Date().toISOString():'',clienteId:cli?cli.id:'',clienteNombre:cli?cli.nombre:'Consumidor final',clienteRif:cli?cli.rif:'',items:items,subtotal:T.sub,descuento:T.desc,ivaPct:T.ivaPct,iva:T.iva,total:T.total,pagos:pagos,vuelto:T.vuelto,estado:esFac?'facturada':'pedido',nota:F.nota||'',pedidoN:F.pedidoN||(old&&old.tipo==='pedido'&&esFac?old.n:null),tasa:(F.editId&&old&&old.tasa)?old.tasa:tasaVal(),usuario:(F.editId&&old&&old.usuario)?old.usuario:(ME?ME.nombre:'')};
    await put('ventas',id,venta);
    if(esFac&&wasEdit)await ajustarEdicion(oldE,items,vNum(venta),id);
    else if(esFac)await moveStock(items,'venta',-1,'Factura '+vNum(venta),id);
    var saved=Object.assign({id:id},venta);
    setF(newF(F.tipo));toast(wasEdit?'Cambios guardados en '+vNum(venta)+'.'+((esFac&&(S.cierres.some(function(c){return c.id===venta.fecha})||S.cierres.some(function(c){return c.id===oldE.fecha})))?' Ya había un cierre de caja guardado para esa fecha: ábrelo y actualízalo.':''):(esFac?'Factura '+vNum(venta)+' emitida.':'Pedido '+vNum(venta)+' guardado.'));
    schedule();dVenta(saved);
  }finally{busy=false}
}

  var N=42,FS=7.5,LH=9.4,W=226.77,mx=(W-N*0.6*FS)/2,L=[];
  var add=function(t,b,c){L.push({t:t,b:!!b,c:!!c})};
  var addW=function(t,b,c){wrapC(t,N).forEach(function(x){add(x,b,c)})};
  var sep=function(){add(new Array(N+1).join('-'))};
  addW(S.config.negocio,true,true);
  if(S.config.rif)addW('RIF: '+S.config.rif,false,true);
  sep();addW('FACTURA '+vNum(v),true,true);

  sep();
  add(rowC('Subtotal',fm(v.subtotal),N));

  sep();

  if(num(v.vuelto)>0)add(rowC('Vuelto',fm(v.vuelto),N));

  return d.bytes();
}

async function guardarPdf(bytes,name){

    try{await dl.save({filename:name,data:bytes});toast('Archivo listo: '+name)}

  }

/* ---------- Reportes: inventario valorizado por categorías ---------- */
function repData(){
  var cat=V.repCat,cero=V.repCero,map={};
  var cats=S.categorias.slice().sort(byName).map(function(c){var o={id:c.id,nombre:c.nombre,prods:[]};map[c.id]=o;return o});
  var sin={id:'_none',nombre:'Sin categoría',prods:[]};
  S.productos.forEach(function(p){
    if(!cero&&num(p.stock)<=0)return;
    (map[p.categoriaId]||sin).prods.push(p);
  });
  if(sin.prods.length)cats.push(sin);
  cats=cats.filter(function(c){return c.prods.length&&(!cat||c.id===cat)});
  var tot={n:0,u:0,vc:0,vp:0};
  cats.forEach(function(c){
    c.prods.sort(byName);c.u=0;c.vc=0;c.vp=0;
    c.prods.forEach(function(p){var q=num(p.stock);c.u+=q;c.vc+=q*num(p.costo);c.vp+=q*num(p.precio)});
    c.u=r2(c.u);c.vc=r2(c.vc);c.vp=r2(c.vp);
    tot.n+=c.prods.length;tot.u+=c.u;tot.vc+=c.vc;tot.vp+=c.vp;
  });
  tot.u=r2(tot.u);tot.vc=r2(tot.vc);tot.vp=r2(tot.vp);
  return {cats:cats,tot:tot};
}

    if(ex2)ex2.cant=String(num(ex2.cant)+1);else K.items.push({productoId:p2.id,codigo:p2.codigo,nombre:p2.nombre,cant:'1',costo:String(p2.costo)});
    renderCompraDlg();setTimeout(function(){var n=document.getElementById('k-add');if(n)n.focus()},30);
  }else if(t.id==='b-file'&&t.files&&t.files[0]){
    var rd=new FileReader();rd.onload=function(){var ta=$('#b-text');if(ta){ta.value=String(rd.result||'');bulkPreview()}};rd.readAsText(t.files[0]);
  }
});
dlg.addEventListener('close',function(){dlg.dataset.ret=''});
window.addEventListener('hashchange',setView);

/* ---------- Arranque ---------- */
async function init(){
  applyNav();setView();
  var db=null;
  try{db=window.claude&&await window.claude.use('db')}catch(e){}
  if(!db){mode='local';EDKNOWN=true;lsLoad();ready=true;setView();return}
  DB=db;mode='nube';
  try{var us=await window.claude.use('user');if(us)IS_ED=!!(await us.canEdit())}catch(e){}
  EDKNOWN=true;
  var all=COLS.concat(['config']);
  var done=function(c){loaded[c]=true;if(Object.keys(loaded).length>=all.length&&!ready){ready=true}};
  setTimeout(function(){if(!ready){ready=true;schedule()}},10000);
  all.forEach(function(c){
    DB.collection(c).onSnapshot(function(snap){
      if(c==='config'){var d=snap.docs.find(function(x){return x.id==='general'});if(d)S.config=Object.assign({negocio:'Mi negocio',rif:'',moneda:'$',iva:16},d.data())}
      else S[c]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
      if(!snap.metadata.fromCache)done(c);
      schedule();
    },function(){done(c);schedule()});
  });
  schedule();
}
init();
})();
</script>
